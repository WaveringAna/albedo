[tool.ruff]
target-version = "py314"
include = ["priv/python/**/*.py", "test/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["priv/python", "test", "test/harness", "test/e2e"]

[tool.ty.src]
include = ["priv/python", "test"]

[tool.ty.analysis]
# Optional serializer; the kernel falls back to pickle when it is unavailable.
allowed-unresolved-imports = ["dill"]
