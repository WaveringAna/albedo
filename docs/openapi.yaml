# Daemon protocol 3. See http-api-design.md for behavioral semantics.
openapi: 3.2.1
info:
  title: Albedo daemon API
  version: 3.0.0
  summary: 'Protocol 3: typed HTTP resources and SSE.'
  description: This file owns daemon request and response shapes.
    http-api-design.md owns ordering, atomicity, retry and recovery behavior. Server and clients switch
    together; there are no legacy route aliases. Unknown request fields and duplicate JSON keys are errors.
    Unknown response fields may be ignored by clients. No operation starts or replaces a daemon. JSON
    and SSE frames are at most 1 MiB unless an extension explicitly overrides that limit. Ordinary request
    bodies are at most 64 KiB, input bodies 9,200,000 bytes and proxy bodies 32,000,000 bytes. UTF-8 and
    encoded-byte limits are described with x-max-utf8-bytes/x-max-encoded-bytes; standard schema validation
    alone does not assert them. Examples use synthetic secrets only.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
externalDocs:
  description: Behavior, ownership, feature coverage and verification.
  url: http-api-design.md
security:
- DaemonBearer: []
tags:
- name: server
- name: settings
- name: storage
- name: sessions
- name: models
- name: workspaces
- name: hosts
- name: auth
- name: work
- name: paperclips
- name: schedule
- name: links
- name: webhooks
- name: proxy
paths:
  /server:
    get:
      operationId: getServer
      summary: Read daemon identity and capabilities
      tags:
      - server
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
              examples:
                Server:
                  value:
                    instance_id: instance-1
                    protocol: 3
                    state: ready
                    capabilities:
                      durable_inputs: 1
                      session_replay: 1
                      collection_invalidation: 1
                      tool_progress: 1
                      storage_report: 1
                    build: example-build
                    digest: null
                    extensions:
                    - name: work
                      version: 1
                    quota: null
                    notices: []
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '405':
          $ref: '#/components/responses/Problem405'
        '406':
          $ref: '#/components/responses/Problem406'
        '503':
          $ref: '#/components/responses/Problem503'
      description: No startup or replacement. Authentication and protocol failures remain actionable errors.
        Pagination is valid only with include=quota_history.
      parameters:
      - name: include
        in: query
        required: false
        schema:
          type: string
          enum: [quota_history]
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Next'
  /server/shutdown:
    post:
      operationId: shutdownServer
      summary: Drain the identified daemon
      tags:
      - server
      responses:
        '202':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shutdown'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '405':
          $ref: '#/components/responses/Problem405'
        '406':
          $ref: '#/components/responses/Problem406'
        '503':
          $ref: '#/components/responses/Problem503'
        '413':
          $ref: '#/components/responses/Problem413'
        '415':
          $ref: '#/components/responses/Problem415'
        '409':
          $ref: '#/components/responses/Problem409'
      description: No automatic recovery or replay. The local launcher alone may offer replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShutdownRequest'
        description: UTF-8 JSON; duplicate keys and unknown fields are rejected.
  /settings:
    get:
      operationId: getSettings
      summary: Read shared settings or one canonical group
      tags:
      - settings
      responses:
        '200':
          description: Successful result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsRead'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '405':
          $ref: '#/components/responses/Problem405'
        '406':
          $ref: '#/components/responses/Problem406'
        '503':
          $ref: '#/components/responses/Problem503'
      description: Without group, return Settings and observed group validators. With group, return that
        group only; the ETag covers that representation.
      parameters:
      - name: group
        in: query
        required: false
        schema:
          type: string
          enum: [providers, mcp, extensions, capabilities, models, ui]
    patch:
      operationId: patchSettings
      summary: Atomically edit one settings group
      tags:
      - settings
      responses:
        '200':
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsChange'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '405':
          $ref: '#/components/responses/Problem405'
        '406':
          $ref: '#/components/responses/Problem406'
        '503':
          $ref: '#/components/responses/Problem503'
        '413':
          $ref: '#/components/responses/Problem413'
        '415':
          $ref: '#/components/responses/Problem415'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'
      description: Query group selects its corresponding schema. Omitted fields keep values. Null removes
        only nullable fields or map entries. Candidate validation precedes the complete group commit.
        No lost-response retry.
      parameters:
      - name: group
        in: query
        required: true
        schema:
          type: string
          enum: [providers, mcp, extensions, capabilities, models, ui]
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
            examples:
              ProviderSettingsPatch:
                value:
                  default_profile: personal
                  profiles:
                    personal:
                      extension: openai
                      endpoint: https://provider.example/v1
                      protocol: responses
                      model: example-model
                      effort: null
                      image_edge: null
                      account_id: null
                      api_key: synthetic-example-key
        description: UTF-8 JSON; duplicate keys and unknown fields are rejected.
