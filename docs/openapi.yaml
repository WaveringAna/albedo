            required: [id, kind, message]
            additionalProperties: false
          maxItems: 100
        quota_history:
          $ref: '#/components/schemas/QuotaPage'
      required: [instance_id, protocol, state, capabilities, build, digest, extensions, quota, notices]
      additionalProperties: false
      examples:
