components:
  securitySchemes:
    DaemonBearer:
      type: http
      scheme: bearer
      description: Daemon operator token, supplied out of band. Browser clients use fetch for authenticated
        JSON and SSE. No query tokens or authentication cookies.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Albedo-Signature
      description: Default header only. Each hook may configure another header and prefix. HMAC-SHA256
        over exact raw bytes; bearer is not an alternative.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ETag'
      description: Observed canonical representation validator. Wildcards and weak validators are not
        accepted.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      schema:
        const: '*'
      description: Conditional creation only.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Next:
      name: next
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageToken'
  headers:
    ETag:
      description: Opaque strong validator for the complete canonical JSON representation. Mutation envelopes
        carry their resource validator inside the body.
      schema:
        $ref: '#/components/schemas/ETag'
    Location:
      description: URL of the created resource.
      schema:
        $ref: '#/components/schemas/ResourceURL'
      required: true
    Vary:
      description: Includes Accept; browser responses also include Origin.
      schema:
        type: string
    RetryAfter:
      description: Seconds until a later new admission may succeed. Never retries an already rejected
        identified input.
      schema:
        type: integer
        minimum: 0
        maximum: 3600
    WWWAuthenticate:
      description: Bearer challenge.
      schema:
        type: string
        pattern: ^Bearer
    Allow:
      description: Allowed methods for a known path.
      schema:
        type: string
  responses:
    Problem400:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: Missing or invalid daemon token
      headers:
        WWWAuthenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: Disallowed origin or caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: Unknown resource or disabled service
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem405:
      description: Method not allowed
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem406:
      description: Unsupported response media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflicting intent, busy state or stale catalog
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: Expired identity, deletion tombstone or obsolete context
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: Stale representation or failed creation condition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: Body too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: Unsupported request media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: Required precondition missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Admission limit
      headers:
        RetryAfter:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: Unavailable owner, storage or upstream preparation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ID:
      type: string
      minLength: 1
      description: Opaque identity. Never infer a resource type or route from its contents.
      maxLength: 512
    UUIDv7:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: Client-generated lowercase UUIDv7. Retained decisions are checked before timestamp
        expiry.
    Generation:
      type: string
      pattern: ^[A-Za-z0-9_-]{21}[AQgw]$
      description: 128 random bits encoded as unpadded base64url; new for each session actor lifetime.
    Counter:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
      description: UTC RFC 3339.
    PageToken:
      type: string
      minLength: 1
      description: Opaque continuation, tied to the query and representation; never authority.
      maxLength: 4096
    ETag:
      type: string
      pattern: ^"[^"\r\n]+"$
      description: Strong opaque validator for the complete canonical representation.
      maxLength: 512
    ResourceURL:
      type: string
      pattern: ^/([^/#][^#]*)?$
      description: Daemon-relative URL, including any representation query. No foreign origin or fragment.
      maxLength: 16384
    Workspace:
      type: string
      minLength: 1
      description: Canonical daemon-host location, local or SSH. Clients do not resolve this path locally.
      maxLength: 4096
    SafeReason:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        detail:
          type: string
          maxLength: 4096
      required: [code, detail]
      additionalProperties: false
    Warnings:
      type: array
      items:
        $ref: '#/components/schemas/SafeReason'
      maxItems: 100
    DynamicJSON:
      description: 'Explicit domain payload: tool arguments, tool results, provider-private state, or
        extension data. JSON values of any type are allowed; no core resource uses this as its envelope.'
    Problem:
      type: object
      properties:
        type:
          const: about:blank
        title:
          type: string
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4096
        code:
          type: string
          minLength: 1
          maxLength: 100
        fields:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
                maxLength: 4096
              detail:
                type: string
                maxLength: 4096
            required: [pointer, detail]
            additionalProperties: false
          maxItems: 100
        decision:
          oneOf:
          - $ref: '#/components/schemas/CreationDecision'
          - $ref: '#/components/schemas/InputDecision'
      required: [type, title, status, detail, code]
      additionalProperties: false
      examples:
      - type: about:blank
        title: Queue full
        status: 429
        detail: This session already has 32 waiting inputs.
        code: queue_full
        decision:
          kind: input
          input:
            id: 01a0fcea-2b00-7000-8000-000000000002
            session_id: 01a0fcea-2b00-7000-8000-000000000001
            kind: message
            admission: rejected
            http_status: 429
            problem:
              type: about:blank
              title: Queue full
              status: 429
              detail: This session already has 32 waiting inputs.
              code: queue_full
            accepted_at: null
            acceptance_order: null
            delivery: null
            blocking_reason: null
            transcript_position: null
            turn: null
            client_id: draft-1
    EmptyRequest:
      type: object
      properties: {}
      additionalProperties: false
    Cursor:
      type: object
      properties:
        generation:
          $ref: '#/components/schemas/Generation'
        sequence:
          $ref: '#/components/schemas/Counter'
      required: [generation, sequence]
      additionalProperties: false
    ResourceValidator:
      type: object
      properties:
        url:
          $ref: '#/components/schemas/ResourceURL'
        etag:
          $ref: '#/components/schemas/ETag'
      required: [url, etag]
      additionalProperties: false
    Notification:
      type: object
      properties:
        state:
          type: string
          enum: [not_requested, queued, failed]
        code:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
        detail:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
      required: [state, code, detail]
      additionalProperties: false
    TargetNotification:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/ID'
        notification:
          $ref: '#/components/schemas/Notification'
      required: [session_id, notification]
      additionalProperties: false
    QuotaObservation:
      type: object
      properties:
        sequence:
          $ref: '#/components/schemas/Counter'
        provider:
          $ref: '#/components/schemas/ID'
        account_id:
          $ref: '#/components/schemas/ID'
        limit_id:
          type: string
          maxLength: 256
        label:
          type: string
          maxLength: 4096
        plan:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
        used_percent:
          anyOf:
          - type: number
          - type: 'null'
        window_label:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
        window_seconds:
          anyOf:
          - $ref: '#/components/schemas/Counter'
          - type: 'null'
        resets_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        scope:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
        status:
          type: string
          maxLength: 256
        source:
          type: string
          maxLength: 256
        error:
          anyOf:
          - $ref: '#/components/schemas/SafeReason'
          - type: 'null'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - sequence
      - provider
      - account_id
      - limit_id
      - label
      - plan
      - used_percent
      - window_label
      - window_seconds
      - resets_at
      - scope
      - status
      - source
      - error
      - observed_at
      additionalProperties: false
    QuotaPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuotaObservation'
          maxItems: 200
        next:
          anyOf:
          - $ref: '#/components/schemas/PageToken'
          - type: 'null'
      required: [items, next]
      additionalProperties: false
    Server:
      type: object
      properties:
        instance_id:
          $ref: '#/components/schemas/ID'
        protocol:
          const: 3
        state:
          type: string
          enum: [ready, draining]
        capabilities:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        build:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
        digest:
          type: [string, 'null']
          pattern: ^[0-9a-f]{64}$
          description: Content digest of the running code tree; update information, not attachment compatibility.
        extensions:
          type: array
          items:
            type: object
            properties:
              name:
                $ref: '#/components/schemas/ID'
              version:
                type: integer
                minimum: 1
                maximum: 9007199254740991
            required: [name, version]
            additionalProperties: false
          maxItems: 200
        quota:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/QuotaObservation'
